<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkat Textiles - Online Shop</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <header class="bg-indigo-700 text-white p-5 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold tracking-wide">VENKAT TEXTILES</h1>
                <p class="text-sm text-indigo-200 mt-1">GSTIN: 37ADGPY4978G1ZR</p>
            </div>
            <span class="bg-indigo-800 px-4 py-2 rounded-lg text-base font-bold shadow">Wholesale Store</span>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b-2 border-indigo-500 pb-2">మా లైవ్ కలెక్షన్స్</h2>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="col-span-full text-center py-10 text-lg font-semibold text-gray-600">ప్రొడక్ట్స్ లోడ్ అవుతున్నాయి...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPOp8NtMBP09rNtCGe5-wRre6Y_Zt5g0M",
            authDomain: "venkat-textiles.firebaseapp.com",
            projectId: "venkat-textiles",
            storageBucket: "venkat-textiles.firebasestorage.app",
            messagingSenderId: "636994469508",
            appId: "1:636994469508:web:3635e18d8ee64288be0cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            try {
                const q = query(collection(db, "items"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                grid.innerHTML = '';

                if (querySnapshot.empty) {
                    grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10 text-lg">ప్రస్తుతం ఎటువంటి ప్రొడక్ట్స్ అందుబాటులో లేవు.</p>`;
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const p = docItem.data();
                    const docId = docItem.id;

                    grid.innerHTML += `
                        <div class="bg-white rounded-xl shadow-xl overflow-hidden flex flex-col justify-between border border-gray-200">
                            <img class="h-80 w-full object-cover" src="${p.image}" alt="${p.name}">
                            <div class="p-5 flex flex-col flex-grow">
                                <h3 class="font-extrabold text-gray-900 text-xl mb-1">${p.name}</h3>
                                <p class="text-gray-600 text-sm mb-4 flex-grow">${p.description || ''}</p>
                                
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-2xl font-black text-green-700">₹${p.price}</span>
                                    <button onclick="sendOrder('${p.name.replace(/'/g, "\\'")}', '${p.price}')" class="bg-green-600 text-white text-sm px-4 py-2.5 rounded-lg font-bold shadow hover:bg-green-700 transition">
                                        💬 WhatsApp ఆర్డర్
                                    </button>
                                </div>

                                <!-- UPI Payment Gateway Button -->
                                <button onclick="payWithUPI('${p.name.replace(/'/g, "\\'")}', '${p.price}')" class="w-full mb-2 bg-blue-600 text-white text-sm py-2.5 rounded-lg font-bold shadow hover:bg-blue-700 transition">
                                    💳 Pay Now (GooglePay / PhonePe / UPI)
                                </button>

                                <button onclick="deleteProduct('${docId}')" class="w-full bg-red-500 text-white text-xs py-2 rounded-lg font-semibold hover:bg-red-600 transition">
                                    🗑️ ఈ ప్రొడక్ట్ తొలగించు (Delete)
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                grid.innerHTML = `<p class="text-red-500 col-span-full text-center text-lg">డేటా లోడ్ అవ్వలేదు: ${e.message}</p>`;
            }
        }

        window.sendOrder = function(name, price) {
            const myNumber = "919441447923";
            const text = `హలో Venkat Textiles, నేను మీ సైట్‌లో ఈ ప్రొడక్ట్ చూశాను:\n\nSaree: *${name}*\nPrice: *₹${price}*\n\nఆర్డర్ కన్ఫర్మ్ చేయగలరు.`;
            window.open(`https://wa.me/${myNumber}?text=${encodeURIComponent(text)}`, '_blank');
        }

        // UPI Payment Gateway Integration (మీ UPI ID ఇక్కడ సెట్ చేయబడింది)
        window.payWithUPI = function(name, price) {
            const upiId = "9441447923@ybl"; // మీ ఫోన్‌పే/గూగుల్ పే నంబర్‌తో కూడిన UPI ID
            const payeeName = "Venkat Textiles";
            const note = `Payment for ${name}`;
            
            const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${price}&cu=INR&tn=${encodeURIComponent(note)}`;
            
            // మొబైల్ యూపిఐ యాప్స్ ఓపెన్ చేయడానికి లింక్ ట్రిగ్గర్ చేయడం
            window.location.href = upiUrl;
        }

        window.deleteProduct = async function(id) {
            if (confirm("మీరు నిజంగా ఈ ప్రొడక్ట్‌ని తొలగించాలనుకుంటున్నారా?")) {
                try {
                    await deleteDoc(doc(db, "items", id));
                    alert("ప్రొడక్ట్ విజయవంతంగా తొలగించబడింది!");
                    loadProducts();
                } catch (error) {
                    alert("తొలగించడంలో ఎర్రర్ వచ్చింది: " + error.message);
                }
            }
        }

        loadProducts();
    </script>
</body>
</html>
