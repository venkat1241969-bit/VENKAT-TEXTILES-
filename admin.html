<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkat Textiles - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPOp8NtMBP09rNtCGe5-wRre6Y_Zt5g0M",
            authDomain: "venkat-textiles.firebaseapp.com",
            projectId: "venkat-textiles",
            storageBucket: "venkat-textiles.firebasestorage.app",
            messagingSenderId: "636994469508",
            appId: "1:636994469508:web:3635e18d8ee64288be0cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Add Product Form Handler
        window.addProduct = async function(event) {
            event.preventDefault();
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const discount = document.getElementById('prodDiscount').value;
            const stock = document.getElementById('prodStock').value;
            const image = document.getElementById('prodImage').value;
            const desc = document.getElementById('prodDesc').value;

            const btn = document.getElementById('saveBtn');
            btn.innerText = "సేవ్ అవుతోంది...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "items"), {
                    name,
                    price: Number(price),
                    discount: Number(discount) || 30,
                    stock: Number(stock) || 1,
                    image,
                    description: desc,
                    status: Number(stock) > 0 ? "In Stock" : "Out of Stock",
                    timestamp: new Date().toISOString()
                });
                alert("ప్రొడక్ట్ విజయవంతంగా జోడించబడింది!");
                document.getElementById('productForm').reset();
                loadAdminProducts();
            } catch (e) {
                alert("ఎర్రర్: " + e.message);
            } finally {
                btn.innerText = "ప్రొడక్ట్ సేవ్ చేయి";
                btn.disabled = false;
            }
        };

        // Load Products in Admin Panel
        window.loadAdminProducts = async function() {
            const list = document.getElementById('admin-products-list');
            try {
                const q = query(collection(db, "items"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                let content = '';

                if (querySnapshot.empty) {
                    list.innerHTML = `<p class="text-gray-500 text-center py-6 text-xs">ప్రొడక్ట్స్ ఏవీ లేవు.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const id = docSnap.id;
                    content += `
                        <div class="bg-white p-2.5 rounded-xl border border-gray-200 flex items-center justify-between gap-2 shadow-sm">
                            <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg">
                            <div class="flex-grow">
                                <h4 class="font-bold text-xs text-gray-900 truncate max-w-[120px]">${p.name}</h4>
                                <p class="text-[10px] text-rose-600 font-black">₹${p.price} | Stock: ${p.stock}</p>
                            </div>
                            <button onclick="deleteProduct('${id}')" class="bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded-lg text-[10px] font-bold">డిలీట్</button>
                        </div>
                    `;
                });
                list.innerHTML = content;
            } catch (e) {
                list.innerHTML = `<p class="text-red-500 text-center text-xs">లోడ్ అవ్వలేదు</p>`;
            }
        };

        window.deleteProduct = async function(id) {
            if(confirm("ఈ ప్రొడక్ట్‌ని డిలీట్ చేయాలనుకుంటున్నారా?")) {
                await deleteDoc(doc(db, "items", id));
                loadAdminProducts();
            }
        };

        // Load Customer Orders for Admin Management & Waybill Update
        window.loadAdminOrders = async function() {
            const container = document.getElementById('admin-orders-list');
            container.innerHTML = `<p class="text-gray-500 text-center text-xs py-4">ఆర్డర్లు లోడ్ అవుతున్నాయి...</p>`;

            try {
                const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);

                if(querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-center text-xs py-6">ఆర్డర్లు ఏవీ లేవు.</p>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const ord = docSnap.data();
                    const docId = docSnap.id;
                    html += `
                        <div class="bg-white border border-gray-200 rounded-xl p-3 text-xs space-y-2 shadow-sm">
                            <div class="flex justify-between font-bold text-gray-900 border-b pb-1">
                                <span>🆔 ${ord.orderId}</span>
                                <span class="text-rose-600">₹${ord.total}</span>
                            </div>
                            <p class="text-[10px] text-gray-700"><b>పేరు:</b> ${ord.name} | <b>ఫోన్:</b> ${ord.phone}</p>
                            <p class="text-[10px] text-gray-700"><b>అడ్రస్:</b> ${ord.address} - ${ord.pincode}</p>
                            <p class="text-[10px] text-gray-700"><b>UTR ID:</b> ${ord.utrNumber}</p>
                            
                            <div class="bg-gray-50 p-2 rounded-lg border border-gray-200 space-y-1.5">
                                <p class="text-[10px] font-bold text-gray-800">🚚 షిప్పింగ్ & వేబిల్లు అప్‌డేట్:</p>
                                <div>
                                    <label class="text-[9px] text-gray-500 block">Waybill / Tracking No:</label>
                                    <input type="text" id="waybill_${docId}" value="${ord.waybill || ''}" placeholder="వేబిల్లు నంబర్ రాయండి" class="w-full border px-2 py-1 text-xs rounded bg-white">
                                </div>
                                <div>
                                    <label class="text-[9px] text-gray-500 block">Shipping Date:</label>
                                    <input type="text" id="date_${docId}" value="${ord.shippingDate || ''}" placeholder="ఉదా: 18 Sep 2026" class="w-full border px-2 py-1 text-xs rounded bg-white">
                                </div>
                                <button onclick="saveOrderTracking('${docId}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded text-xs font-bold shadow transition mt-1">
                                    💾 సేవ్ & అప్‌డేట్ (Save)
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = `<p class="text-red-500 text-center text-xs">లోపం: ${e.message}</p>`;
            }
        };

        window.saveOrderTracking = async function(docId) {
            const waybill = document.getElementById(`waybill_${docId}`).value.trim();
            const shippingDate = document.getElementById(`date_${docId}`).value.trim();

            try {
                await updateDoc(doc(db, "orders", docId), {
                    waybill: waybill,
                    shippingDate: shippingDate
                });
                alert("వేబిల్లు మరియు తేదీ విజయవంతంగా సేవ్ చేయబడ్డాయి!");
                loadAdminOrders();
            } catch(e) {
                alert("సేవ్ అవ్వలేదు: " + e.message);
            }
        };

        window.onload = function() {
            loadAdminProducts();
            loadAdminOrders();
        };
    </script>
</head>
<body class="bg-gray-100 pb-16">

    <!-- Header -->
    <header class="bg-gray-900 text-white p-3 sticky top-0 z-40 shadow flex justify-between items-center">
        <h1 class="text-sm font-black tracking-wide">VENKAT TEXTILES - ADMIN PANEL</h1>
        <a href="index.html" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold">స్టోర్ కి వెళ్ళు (Store)</a>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto p-3 max-w-xl space-y-4">
        
        <!-- Add Product Section -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider border-b pb-1">➕ కొత్త ప్రొడక్ట్ జోడించండి</h2>
            <form id="productForm" onsubmit="addProduct(event)" class="space-y-2.5">
                <div>
                    <label class="text-[10px] font-semibold text-gray-600 block">ప్రొడక్ట్ పేరు:</label>
                    <input type="text" id="prodName" required placeholder="ఉదా: పట్టు చీర" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] font-semibold text-gray-600 block">ధర (₹):</label>
                        <input type="number" id="prodPrice" required placeholder="450" class="w-full border px-2 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold text-gray-600 block">డిస్కౌంట్ (%):</label>
                        <input type="number" id="prodDiscount" value="30" class="w-full border px-2 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold text-gray-600 block">స్టాక్ (Qty):</label>
                        <input type="number" id="prodStock" required placeholder="10" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-semibold text-gray-600 block">ఇమేజ్ లింక్ (Image URL):</label>
                    <input type="url" id="prodImage" required placeholder="https://..." class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                </div>
                <div>
                    <label class="text-[10px] font-semibold text-gray-600 block">వివరణ (Description):</label>
                    <input type="text" id="prodDesc" placeholder="సిక్స్ కలర్స్ మ్యాచింగ్" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs py-2.5 rounded-xl font-bold shadow transition mt-2">
                    ప్రొడక్ట్ సేవ్ చేయి
                </button>
            </form>
        </section>

        <!-- Customer Orders Management Section -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider border-b pb-1 flex justify-between items-center">
                <span>📦 కస్టమర్ ఆర్డర్లు & వేబిల్లు అప్‌డేట్</span>
                <button onclick="loadAdminOrders()" class="text-[10px] text-rose-600 font-bold bg-rose-50 px-2 py-0.5 rounded border border-rose-200">రిఫ్రెష్</button>
            </h2>
            <div id="admin-orders-list" class="space-y-3">
                <p class="text-gray-400 text-center text-xs py-4">ఆర్డర్లు లోడ్ అవుతున్నాయి...</p>
            </div>
        </section>

        <!-- Manage Existing Products -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider border-b pb-1">📋 ప్రొడక్ట్స్ జాబితా & స్టాక్ మేనేజ్‌మెంట్</h2>
            <div id="admin-products-list" class="space-y-2"></div>
        </section>

    </main>

</body>
</html>
