<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkat Textiles - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-20">

    <header class="bg-rose-700 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-sm font-black tracking-wide">Venkat Textiles - Admin Panel</h1>
        <a href="index.html" class="bg-white text-rose-700 text-xs px-3 py-1.5 rounded-lg font-bold shadow">🛍️ Shop View</a>
    </header>

    <main class="container mx-auto p-4 max-w-lg">
        <!-- Add / Edit Product Form Card -->
        <div class="bg-white rounded-2xl shadow-md p-5 border border-gray-200 mb-6">
            <h2 id="formTitle" class="text-base font-bold text-gray-800 mb-4 border-b pb-2">➕ కొత్త ప్రొడక్ట్ జోడించండి</h2>
            
            <input type="hidden" id="editDocId" value="">

            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600 mb-1 block">ప్రొడక్ట్ పేరు (Name):</label>
                    <input type="text" id="pName" placeholder="ఉదా: Wholesale Saree" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-semibold text-gray-600 mb-1 block">ధర (Price ₹):</label>
                        <input type="number" id="pPrice" placeholder="1316" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600 mb-1 block">డిస్కౌంట్ శాతం (%):</label>
                        <input type="number" id="pDiscount" value="30" placeholder="30" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-semibold text-gray-600 mb-1 block">స్టాక్ క్వాంటిటీ (Qty):</label>
                        <input type="number" id="pStock" value="10" placeholder="10" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600 mb-1 block">కేటగిరీ (Category - Manual):</label>
                        <input type="text" id="pCategory" placeholder="ఉదా: Sarees" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-semibold text-gray-600 mb-1 block">స్టాక్ స్థితి (Status):</label>
                    <select id="pStatus" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
                        <option value="In Stock">In Stock (అందుబాటులో ఉంది)</option>
                        <option value="Out of Stock">Out of Stock (అయిపోయింది)</option>
                    </select>
                </div>

                <!-- Gallery Photo Upload Option -->
                <div>
                    <label class="text-xs font-semibold text-gray-600 mb-1 block">గ్యాలరీ నుండి ఫోటో సెలెక్ట్ చేయండి:</label>
                    <input type="file" id="pImageFile" accept="image/*" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                    <p class="text-[10px] text-gray-400 mt-1">ఎడిట్ చేసేటప్పుడు ఫోటో మార్చకపోతే పాతదే ఉంటుంది.</p>
                </div>

                <div>
                    <label class="text-xs font-semibold text-gray-600 mb-1 block">వివరణ (Description):</label>
                    <textarea id="pDesc" rows="2" placeholder="Pure Wholesale Quality..." class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50"></textarea>
                </div>

                <button onclick="saveProduct()" id="saveBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl font-bold text-xs shadow-lg transition">
                    🚀 ప్రొడక్ట్ పబ్లిష్ చేయండి (Publish)
                </button>
                <button onclick="resetForm()" id="cancelBtn" class="w-full bg-gray-300 text-gray-700 py-2 rounded-xl font-bold text-xs hidden transition">
                    క్యాన్సల్ (Cancel Edit)
                </button>
            </div>
        </div>

        <h3 class="text-sm font-bold text-gray-800 mb-3">📦 లైవ్ ప్రొడక్ట్స్ మేనేజ్‌మెంట్</h3>
        <div id="admin-products-list" class="space-y-3">
            <p class="text-center text-xs text-gray-500 py-4">ప్రొడక్ట్స్ లోడ్ అవుతున్నాయి...</p>
        </div>
    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPOp8NtMBP09rNtCGe5-wRre6Y_Zt5g0M",
            authDomain: "venkat-textiles.firebaseapp.com",
            projectId: "venkat-textiles",
            storageBucket: "venkat-textiles.firebasestorage.app",
            messagingSenderId: "636994469508",
            appId: "1:636994469508:web:3635e18d8ee64288be0cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allProductsCache = {};

        window.saveProduct = async function() {
            const editId = document.getElementById('editDocId').value;
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const discount = document.getElementById('pDiscount').value || "30";
            const stock = document.getElementById('pStock').value;
            const category = document.getElementById('pCategory').value || "General";
            const status = document.getElementById('pStatus').value;
            const fileInput = document.getElementById('pImageFile');
            const description = document.getElementById('pDesc').value;

            if(!name || !price) {
                alert("దయచేసి ప్రొడక్ట్ పేరు మరియు ధర పూర్తిగా నింపండి!");
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.innerText = "సేవ్ అవుతోంది...";
            btn.disabled = true;

            try {
                if (editId) {
                    const updateData = {
                        name,
                        price: Number(price),
                        discount: Number(discount),
                        stock: Number(stock),
                        category,
                        status,
                        description
                    };

                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        const base64Image = await toBase64(file);
                        updateData.image = base64Image;
                    }

                    await updateDoc(doc(db, "items", editId), updateData);
                    alert("ప్రొడక్ట్ విజయవంతంగా అప్‌డేట్ చేయబడింది!");
                    resetForm();
                } else {
                    if (fileInput.files.length === 0) {
                        alert("దయచేసి గ్యాలరీ నుండి ఫోటోని సెలెక్ట్ చేయండి!");
                        btn.innerText = "🚀 ప్రొడక్ట్ పబ్లిష్ చేయండి (Publish)";
                        btn.disabled = false;
                        return;
                    }
                    const file = fileInput.files[0];
                    const base64Image = await toBase64(file);

                    await addDoc(collection(db, "items"), {
                        name,
                        price: Number(price),
                        discount: Number(discount),
                        stock: Number(stock),
                        category,
                        status,
                        image: base64Image,
                        description,
                        timestamp: Date.now()
                    });

                    alert("ప్రొడక్ట్ విజయవంతంగా పబ్లిష్ చేయబడింది!");
                    resetForm();
                }
                loadAdminProducts();
            } catch (error) {
                alert("ఎర్రర్ వచ్చింది: " + error.message);
            } finally {
                btn.innerText = "🚀 ప్రొడక్ట్ పబ్లిష్ చేయండి (Publish)";
                btn.disabled = false;
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function loadAdminProducts() {
            const listEl = document.getElementById('admin-products-list');
            try {
                const q = query(collection(db, "items"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                let html = '';

                if (querySnapshot.empty) {
                    listEl.innerHTML = `<p class="text-center text-xs text-gray-500 py-4">ప్రొడక్ట్స్ ఏవీ లేవు.</p>`;
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const p = docItem.data();
                    const id = docItem.id;
                    allProductsCache[id] = p;
                    const stockQty = Number(p.stock) || 0;
                    const disc = p.discount || 30;
                    const cat = p.category || 'General';
                    const isOut = (p.status === "Out of Stock" || stockQty <= 0);

                    html += `
                        <div class="bg-white rounded-xl p-3 border border-gray-200 flex items-center justify-between shadow-sm">
                            <div class="flex items-center gap-3">
                                <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg bg-gray-100">
                                <div>
                                    <h4 class="font-bold text-gray-800 text-xs truncate max-w-[130px]">${p.name}</h4>
                                    <p class="text-rose-600 font-black text-xs">₹${p.price} <span class="text-[10px] text-gray-400 font-normal">(${cat})</span></p>
                                    <p class="text-[10px] text-gray-500">Qty: ${stockQty} | Disc: ${disc}%</p>
                                    <span class="text-[9px] px-1.5 py-0.5 rounded font-bold ${isOut ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">
                                        ${isOut ? 'Out of Stock' : 'In Stock'}
                                    </span>
                                </div>
                            </div>
                            <div class="flex gap-1.5">
                                <button onclick="editProduct('${id}')" class="bg-sky-50 hover:bg-sky-100 text-sky-600 text-xs px-2.5 py-1.5 rounded-lg font-bold transition">
                                    ✏️ Edit
                                </button>
                                <button onclick="deleteProduct('${id}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2.5 py-1.5 rounded-lg font-bold transition">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;
            } catch (e) {
                listEl.innerHTML = `<p class="text-red-500 text-center text-xs">లోడ్ అవ్వలేదు: ${e.message}</p>`;
            }
        }

        window.editProduct = function(id) {
            const p = allProductsCache[id];
            if(!p) return;

            document.getElementById('editDocId').value = id;
            document.getElementById('pName').value = p.name || '';
            document.getElementById('pPrice').value = p.price || '';
            document.getElementById('pDiscount').value = p.discount || 30;
            document.getElementById('pStock').value = p.stock || 10;
            document.getElementById('pCategory').value = p.category || '';
            document.getElementById('pStatus').value = p.status || 'In Stock';
            document.getElementById('pDesc').value = p.description || '';

            document.getElementById('formTitle').innerText = "✏️ ప్రొడక్ట్ వివరాలు సవరించండి (Edit)";
            document.getElementById('saveBtn').innerText = "💾 మార్పులు సేవ్ చేయి (Update)";
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetForm = function() {
            document.getElementById('editDocId').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDiscount').value = '30';
            document.getElementById('pStock').value = '10';
            document.getElementById('pCategory').value = '';
            document.getElementById('pImageFile').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('formTitle').innerText = "➕ కొత్త ప్రొడక్ట్ జోడించండి";
            document.getElementById('saveBtn').innerText = "🚀 ప్రొడక్ట్ పబ్లిష్ చేయండి (Publish)";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        window.deleteProduct = async function(id) {
            if(confirm("ఈ ప్రొడక్ట్‌ని తొలగించాలనుకుంటున్నారా?")) {
                try {
                    await deleteDoc(doc(db, "items", id));
                    alert("తొలగించబడింది!");
                    loadAdminProducts();
                } catch(e) {
                    alert("ఎర్రర్: " + e.message);
                }
            }
        }

        loadAdminProducts();
    </script>
</body>
</html>
