<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkat Textiles - Online Shop</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">VENKAT TEXTILES</h1>
                <p class="text-xs text-indigo-200">GSTIN: 37ADGPY4978G1ZR</p>
            </div>
            <span class="bg-indigo-800 px-3 py-1 rounded text-sm">Wholesale Store</span>
        </div>
    </header>

    <!-- Products Grid -->
    <main class="container mx-auto p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">మా లైవ్ కలెక్షన్స్</h2>
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <p class="col-span-full text-center py-10">ప్రొడక్ట్స్ లోడ్ అవుతున్నాయి...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://gstatic.com";

        // ⚠️ ఇక్కడ కూడా మీ Firebase కీలను పెట్టండి (స్టెప్ 2 లో పెట్టినవే)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            try {
                // టైమ్‌స్టాంప్ ఆధారంగా కొత్త ప్రొడక్ట్స్ ముందు వచ్చేలా ఆర్డర్ చేయడం
                const q = query(collection(db, "products"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                grid.innerHTML = '';

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    grid.innerHTML += `
                        <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col justify-between">
                            <img class="h-48 w-full object-cover" src="${p.image}" alt="${p.name}">
                            <div class="p-3">
                                <h3 class="font-bold text-gray-900 text-sm md:text-base">${p.name}</h3>
                                <p class="text-gray-500 text-xs my-1">${p.description || ''}</p>
                                <div class="flex justify-between items-center mt-3">
                                    <span class="text-lg font-bold text-green-600">₹${p.price}</span>
                                    <button onclick="sendOrder('${p.name}', '${p.price}')" class="bg-green-500 text-white text-xs px-2 py-1.5 rounded font-bold hover:bg-green-600">
                                        WhatsApp ఆర్డర్
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                grid.innerHTML = `<p class="text-red-500 col-span-full text-center">డేటా లోడ్ అవ్వలేదు: ${e.message}</p>`;
            }
        }

        window.sendOrder = function(name, price) {
            const myNumber = "91XXXXXXXXXX"; // 👈 ఇక్కడ మీ వాట్సాప్ నంబర్ (కంట్రీ కోడ్ 91 తో) ఇవ్వండి
            const text = `హలో Venkat Textiles, నేను మీ సైట్‌లో ఈ ప్రొడక్ట్ చూశాను:\n\nSaree: *${name}*\nPrice: *₹${price}*\n\nఆర్డర్ కన్ఫర్మ్ చేయగలరు.`;
            window.open(`https://wa.me{myNumber}?text=${encodeURIComponent(text)}`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
