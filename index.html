<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkat Textiles - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPOp8NtMBP09rNtCGe5-wRre6Y_Zt5g0M",
            authDomain: "venkat-textiles.firebaseapp.com",
            projectId: "venkat-textiles",
            storageBucket: "venkat-textiles.firebasestorage.app",
            messagingSenderId: "636994469508",
            appId: "1:636994469508:web:3635e18d8ee64288be0cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];

        window.loadProducts = async function() {
            const grid = document.getElementById('products-grid');
            try {
                const q = query(collection(db, "items"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                let content = '';

                if (querySnapshot.empty) {
                    grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10 text-sm">ప్రస్తుతం ఎటువంటి ప్రొడక్ట్స్ అందుబాటులో లేవు.</p>`;
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const p = docItem.data();
                    const docId = docItem.id;
                    const safeName = p.name ? p.name.replace(/'/g, "\\'") : '';
                    const priceNum = Number(p.price) || 0;
                    const originalPrice = Math.round(priceNum * 1.4);

                    content += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between relative">
                            <div class="absolute top-2 left-2 bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded z-10 shadow">
                                30% off
                            </div>
                            <img loading="lazy" class="h-44 w-full object-cover bg-gray-100" src="${p.image}" alt="${p.name}">
                            <div class="p-3 flex flex-col flex-grow">
                                <h3 class="font-bold text-gray-900 text-xs mb-1 truncate">${p.name}</h3>
                                <p class="text-gray-500 text-[10px] mb-2 truncate">${p.description || 'Pure Wholesale Quality'}</p>
                                
                                <div class="flex items-center gap-2 mb-3">
                                    <span class="text-sm font-black text-rose-600">₹${priceNum}</span>
                                    <span class="text-[10px] text-gray-400 line-through">₹${originalPrice}</span>
                                </div>

                                <div class="flex gap-1.5 mt-auto">
                                    <button onclick="addToCart('${docId}', '${safeName}', ${priceNum}, '${p.image}')" class="flex-grow bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg font-bold text-xs shadow transition flex justify-center items-center gap-1">
                                        🛒 Add
                                    </button>
                                    <button onclick="sendOrder('${safeName}', '${priceNum}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-2 rounded-lg font-bold shadow transition text-xs">
                                        💬
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = content;
            } catch (e) {
                grid.innerHTML = `<p class="text-red-500 col-span-full text-center text-sm">డేటా లోడ్ అవ్వలేదు: ${e.message}</p>`;
            }
        }

        window.addToCart = function(id, name, price, image) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id, name, price, image, qty: 1 });
            }
            updateCartUI();
            showToast("కార్ట్‌లోకి జోడించబడింది!");
        }

        window.updateQty = function(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const countEl = document.getElementById('cart-count');
            const itemsEl = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            
            const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
            countEl.innerText = totalItems;

            if (cart.length === 0) {
                itemsEl.innerHTML = `<p class="text-gray-400 text-center py-8 text-xs">మీ కార్ట్ ఖాళీగా ఉంది</p>`;
                totalEl.innerText = "₹0";
                return;
            }

            let html = '';
            let subtotal = 0;

            cart.forEach(i => {
                subtotal += i.price * i.qty;
                html += `
                    <div class="flex items-center justify-between gap-2 bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                        <img src="${i.image}" class="w-12 h-12 object-cover rounded-lg">
                        <div class="flex-grow">
                            <h4 class="font-bold text-gray-800 text-xs truncate max-w-[120px]">${i.name}</h4>
                            <p class="text-rose-600 font-black text-xs">₹${i.price * i.qty}</p>
                        </div>
                        <div class="flex items-center gap-1.5 bg-white border border-gray-200 rounded-lg px-2 py-0.5">
                            <button onclick="updateQty('${i.id}', -1)" class="text-gray-500 font-bold px-1 text-xs">-</button>
                            <span class="text-xs font-bold">${i.qty}</span>
                            <button onclick="updateQty('${i.id}', 1)" class="text-rose-600 font-bold px-1 text-xs">+</button>
                        </div>
                    </div>
                `;
            });

            itemsEl.innerHTML = html;
            totalEl.innerText = `₹${subtotal}`;
        }

        window.toggleCart = function() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        window.openCheckoutModal = function() {
            if(cart.length === 0) {
                alert("ముందుగా మీ కార్ట్‌కి ప్రొడక్ట్స్ జోడించండి!");
                return;
            }
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        window.closeCheckoutModal = function() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        window.completeOrder = function() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            if(!name || phone.length !== 10 || !address) {
                alert("దయచేసి మీ పేరు, సరైన 10 అంకెల ఫోన్ నంబర్ మరియు అడ్రస్ పూర్తిగా నింపండి.");
                return;
            }

            let orderSummary = `హలో Venkat Textiles, నేను కొత్త ఆర్డర్ చేయాలనుకుంటున్నాను:\n\n👤 పేరు: *${name}*\n📞 ఫోన్: *${phone}*\n🏠 అడ్రస్: *${address}*\n\n🛒 ప్రొడక్ట్స్:\n`;
            
            let total = 0;
            cart.forEach(i => {
                orderSummary += `- ${i.name} (${i.qty} pcs) : ₹${i.price * i.qty}\n`;
                total += i.price * i.qty;
            });

            orderSummary += `\n💰 మొత్తం బిల్లు (Total): *₹${total}*`;

            const myNumber = "919441447923";
            window.open(`https://wa.me/${myNumber}?text=${encodeURIComponent(orderSummary)}`, '_blank');
        }

        window.sendOrder = function(name, price) {
            const myNumber = "919441447923";
            const text = `హలో Venkat Textiles, నేను ఈ ప్రొడక్ట్ ఆర్డర్ చేయాలనుకుంటున్నాను:\n\nSaree: *${name}*\nPrice: *₹${price}*`;
            window.open(`https://wa.me/${myNumber}?text=${encodeURIComponent(text)}`, '_blank');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                t.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }

        window.onload = loadProducts;
    </script>
</head>
<body class="bg-gray-100 pb-20">

    <!-- Top App Header -->
    <header class="bg-rose-600 text-white p-3 sticky top-0 z-40 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-sm font-black tracking-wide">VENKAT TEXTILES</h1>
            <p class="text-[9px] text-rose-100">GSTIN: 37ADGPY4978G1ZR</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleCart()" class="relative bg-rose-700 p-2 rounded-xl text-white flex items-center gap-1 shadow">
                🛒 <span id="cart-count" class="text-xs font-black">0</span>
            </button>
        </div>
    </header>

    <!-- Main Section -->
    <main class="container mx-auto p-3">
        <h2 class="text-xs font-bold text-gray-700 mb-2.5 uppercase tracking-wider">మా లేటెస్ట్ కలెక్షన్స్</h2>
        <!-- 2 Column Mobile Grid -->
        <div id="products-grid" class="grid grid-cols-2 gap-2.5">
            <p class="col-span-full text-center py-10 text-xs text-gray-500 animate-pulse">ప్రొడక్ట్స్ లోడ్ అవుతున్నాయి...</p>
        </div>
    </main>

    <!-- Cart Modal Drawer -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-xs h-full flex flex-col p-4 shadow-2xl relative">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                <h3 class="text-sm font-black text-gray-800">🛍️ మీ షాపింగ్ కార్ట్</h3>
                <button onclick="toggleCart()" class="text-gray-500 font-bold text-base">✕</button>
            </div>

            <div id="cart-items" class="flex-grow overflow-y-auto space-y-2 pr-1"></div>

            <div class="border-t pt-3 mt-2 bg-white">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs text-gray-500 font-semibold">మొత్తం (Total):</span>
                    <span id="cart-total" class="text-lg font-black text-rose-600">₹0</span>
                </div>
                <button onclick="openCheckoutModal()" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-xl font-bold text-xs shadow-lg transition">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Customer Details & Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl relative">
            <h3 class="text-base font-bold text-gray-900 mb-1">డెలివెరీ వివరాలు</h3>
            <p class="text-[11px] text-gray-500 mb-3">ఆర్డర్ కన్ఫర్మ్ చేయడానికి మీ వివరాలు ఇవ్వండి.</p>
            
            <div class="mb-2.5">
                <label class="text-[11px] font-semibold text-gray-600 mb-1 block">మీ పూర్తి పేరు:</label>
                <input type="text" id="custName" placeholder="ఉదా: వెంకట్" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
            </div>

            <div class="mb-2.5">
                <label class="text-[11px] font-semibold text-gray-600 mb-1 block">ఫోన్ నంబర్:</label>
                <input type="tel" id="custPhone" maxlength="10" placeholder="9441447923" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50">
            </div>

            <div class="mb-3.5">
                <label class="text-[11px] font-semibold text-gray-600 mb-1 block">డెలివెరీ అడ్రస్ (Address):</label>
                <textarea id="custAddress" rows="2" placeholder="ఇంటి నంబర్, ఊరు, పిన్ కోడ్" class="w-full border px-3 py-2 text-xs rounded-xl outline-none bg-gray-50"></textarea>
            </div>

            <button onclick="completeOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2.5 rounded-xl font-bold shadow mb-2.5 flex items-center justify-center gap-1.5">
                💬 WhatsApp ద్వారా ఆర్డర్ పంపు
            </button>

            <button onclick="closeCheckoutModal()" class="w-full text-gray-500 text-[11px] py-1.5 font-semibold">
                మూసివేయి (Cancel)
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-[11px] px-3.5 py-2 rounded-full shadow-2xl transition-all duration-300 translate-y-20 opacity-0 z-50">
        జోడించబడింది
    </div>

</body>
</html>
