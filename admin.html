<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkat Textiles - Admin Panel</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold text-indigo-700 mb-6 text-center">కొత్త ప్రొడక్ట్ అప్‌లోడ్ చేయండి</h2>
        
        <form id="productForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">చీర/ప్రొడక్ట్ పేరు</label>
                <input type="text" id="pName" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ధర (₹ లో)</label>
                <input type="number" id="pPrice" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ఫోటో ఎంచుకోండి (Mobile Gallery)</label>
                <input type="file" id="pImageFile" accept="image/*" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm bg-gray-50">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">వివరాలు (Description)</label>
                <textarea id="pDesc" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"></textarea>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white p-2 rounded-md font-bold hover:bg-indigo-700">Add Product Live</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPOp8NtMBP09rNtCGe5-wRre6Y_Zt5g0M",
            authDomain: "venkat-textiles.firebaseapp.com",
            projectId: "venkat-textiles",
            storageBucket: "venkat-textiles.firebasestorage.app",
            messagingSenderId: "636994469508",
            appId: "1:636994469508:web:3635e18d8ee64288be0cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app, "gs://venkat-textiles.firebasestorage.app");

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "అప్‌లోడ్ అవుతోంది...";

            try {
                const fileInput = document.getElementById('pImageFile').files[0];
                if (!fileInput) {
                    throw new Error("దయచేసి ఫోటోను ఎంచుకోండి!");
                }

                const storageRef = ref(storage, 'products/' + Date.now() + '_' + fileInput.name);
                
                // ఫోటోని అప్‌లోడ్ చేయడం
                const snapshot = await uploadBytes(storageRef, fileInput);
                const downloadURL = await getDownloadURL(snapshot.ref);

                // డేటాబేస్‌లో సేవ్ చేయడం
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('pName').value,
                    price: document.getElementById('pPrice').value,
                    image: downloadURL,
                    description: document.getElementById('pDesc').value,
                    timestamp: new Date()
                });

                alert("ప్రొడక్ట్ విజయవంతంగా లైవ్ చేయబడింది! 🎉");
                document.getElementById('productForm').reset();
            } catch (error) {
                // ఎర్రర్ వస్తే ఇక్కడ బాక్స్‌లో క్లియర్ గా చూపిస్తుంది
                alert("ఎర్రర్ వివరాలు: " + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "Add Product Live";
            }
        });
    </script>
</body>
</html>
