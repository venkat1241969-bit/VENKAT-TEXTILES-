<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkat Textiles - Online Store</title>
    <!-- Tailwind CSS (డిజైన్ అందంగా కనిపించడానికి) -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- హెడర్ (Header) -->
    <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">VENKAT TEXTILES</h1>
                <p class="text-xs text-indigo-200">GSTIN: 37ADGPY4978G1ZR</p>
            </div>
            <button class="bg-white text-indigo-700 px-4 py-2 rounded-lg font-bold shadow hover:bg-indigo-50">
                🛒 Cart
            </button>
        </div>
    </header>

    <!-- మెయిన్ కంటెంట్ -->
    <main class="container mx-auto p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-6 border-b-2 border-indigo-500 pb-2">మా లేటెస్ట్ కలెక్షన్స్ (Live)</h2>
        
        <!-- ప్రొడక్ట్స్ గ్రిడ్ (డేటాబేస్ నుండి ఇక్కడికి లోడ్ అవుతాయి) -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- లోడింగ్ మెసేజ్ -->
            <p class="text-gray-600 col-span-full text-center py-10 font-medium">డేటాబేస్ నుండి ప్రొడక్ట్స్ లోడ్ అవుతున్నాయి...</p>
        </div>
    </main>

    <!-- ఫైర్‌బేస్ SDK స్క్రిప్ట్స్ (Firebase v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, getDocs } from "https://gstatic.com";

        // 🔥 మీ Firebase ప్రాజెక్ట్ కాన్ఫిగరేషన్ వివరాలు ఇక్కడ మార్చాలి
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase ప్రారంభించడం
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // డేటాబేస్ నుండి ప్రొడక్ట్స్ తెచ్చే ఫంక్షన్
        async function fetchProducts() {
            const productsGrid = document.getElementById('products-grid');
            
            try {
                // Firebase Firestoreలోని 'products' అనే కలెక్షన్ నుండి డేటా తెస్తుంది
                const querySnapshot = await getDocs(collection(db, "products"));
                
                // గ్రిడ్‌ను క్లియర్ చేయడం
                productsGrid.innerHTML = '';

                if (querySnapshot.empty) {
                    productsGrid.innerHTML = `<p class="text-center col-span-full text-gray-500">ప్రస్తుతానికి ఎటువంటి ప్రొడక్ట్స్ అందుబాటులో లేవు.</p>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    
                    // ప్రతి ప్రొడక్ట్ కోసం HTML కార్డ్ తయారు చేయడం
                    const productCard = `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col">
                            <img class="h-56 w-full object-cover" src="${product.image || 'https://placeholder.com'}" alt="${product.name}">
                            <div class="p-4 flex flex-col flex-grow">
                                <h3 class="text-lg font-bold text-gray-900 mb-1">${product.name}</h3>
                                <p class="text-gray-600 text-sm flex-grow mb-4">${product.description || 'క్వాలిటీ ఫ్యాబ్రిక్ అండ్ డిజైన్'}</p>
                                <div class="flex justify-between items-center mt-auto">
                                    <span class="text-xl font-extrabold text-green-600">₹${product.price}</span>
                                    <button onclick="orderOnWhatsApp('${product.name}', '${product.price}')" class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-green-600 transition-colors">
                                        WhatsApp Order
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    productsGrid.innerHTML += productCard;
                });
            } catch (error) {
                console.error("Error fetching products: ", error);
                productsGrid.innerHTML = `<p class="text-center col-span-full text-red-500">డేటా లోడ్ చేయడంలో లోపం జరిగింది. కాన్ఫిగరేషన్ తనిఖీ చేయండి.</p>`;
            }
        }

        // వాట్సాప్ ఆర్డర్ ఫంక్షన్ (గ్లోబల్ విండోకు యాడ్ చేయడం)
        window.orderOnWhatsApp = function(name, price) {
            const phoneNumber = "919441447923"; // 👈 మీ వ్యాపార వాట్సాప్ నంబర్ ఇక్కడ ఇవ్వండి
            const message = `హలో Venkat Textiles, నేను మీ యాప్‌లో ఈ ప్రొడక్ట్ చూశాను:\n\n🛍️ *ప్రొడక్ట్:* ${name}\n💰 *ధర:* ₹${price}\n\nదీని గురించి మరిన్ని వివరాలు చెప్పగలరు.`;
            const whatsappUrl = `https://wa.me{phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // పేజీ లోడ్ అవ్వగానే ఫంక్షన్ రన్ అవుతుంది
        fetchProducts();
    </script>
</body>
</html>
